name: Cashea canceled reference hotfix
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261014121000_cashea_cancelled_reference_reuse.sql'
      - 'tests/cashea-cancelled-reference.test.ts'
      - '.github/workflows/cashea-cancelled-reference.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/cashea-cancelled-reference.test.ts tests/cashea-split.test.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
