name: Inventario único y modo estricto
on:
  push:
    branches: [feature/inventario-unico-conteo, feature/inventario-codigos-busqueda, feature/catalogo-unico-inventario, claude/master-junta-29oct, claude/inventario-catalogo-unico]
  pull_request:
    paths:
      - 'lib/inventory-policy.ts'
      - 'lib/domain/oil-change.ts'
      - 'components/order-workspace.tsx'
      - 'components/quick-sale-screen.tsx'
      - 'app/orders/**/oil-change/**'
      - 'supabase/migrations/20261028120000_unified_inventory_strict_mode.sql'
      - 'supabase/migrations/20261028130000_inventory_sale_policy.sql'
      - 'tests/oil-change-picker.test.ts'
      - 'tests/inventory-search.test.ts'
      - 'lib/domain/search.ts'
      - 'lib/oil-quote.ts'
      - 'app/catalog/**'
      - 'app/quote/**'
      - 'tests/oil-quote.test.ts'
      - 'tests/inventory-full.test.ts'
      - 'lib/inventory-full.ts'
      - 'lib/navigation.ts'
      - 'supabase/migrations/20261029210000_inventory_two_views.sql'
      - 'supabase/migrations/20261029040000_inventory_is_catalog.sql'
      - 'app/inventory/**'
      - 'components/order-bonus-product.tsx'
      - 'supabase/migrations/20261028140000_inventory_alt_codes.sql'
      - '.github/workflows/inventory-strict.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run tests/inventory-full.test.ts tests/navigation.test.ts tests/catalog.test.ts tests/oil-quote.test.ts tests/inventory-search.test.ts tests/oil-change-picker.test.ts tests/order-sequence-inventory.test.ts tests/historical-rates.test.ts tests/cashea-split.test.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
