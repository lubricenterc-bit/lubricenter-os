name: Frontend desktop UX
on:
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/service-history/**'
      - 'lib/maintenance-history.ts'
      - 'tests/maintenance-history.test.ts'
      - 'app/customers/**'
      - 'app/vehicles/**'
      - 'app/orders/page.tsx'
      - 'app/quote/**'
      - 'lib/sales-quote.ts'
      - 'tests/sales-quote.test.ts'
      - 'app/orders/**/oil-change/**'
      - 'app/order-extras.css'
      - 'lib/order-extras.ts'
      - 'components/order-extras-checklist.tsx'
      - 'components/order-additional-services.tsx'
      - 'components/order-workspace.tsx'
      - 'tests/order-extras.test.ts'
      - 'components/quick-sale-screen.tsx'
      - 'lib/oil-quote.ts'
      - 'tests/oil-quote.test.ts'
      - 'app/catalog/**'
      - 'lib/catalog.ts'
      - 'tests/catalog.test.ts'
      - 'app/inventory/page.tsx'
      - 'app/layout.tsx'
      - 'app/shell-v2.css'
      - 'app/home-v2.css'
      - 'components/app-shell.tsx'
      - 'components/os-icon.tsx'
      - 'components/app-session-context.tsx'
      - 'lib/navigation.ts'
      - 'tests/navigation.test.ts'
      - 'tests/brand-assets.test.ts'
      - 'lib/brand-image.ts'
      - 'public/lubricenter-brand.svg'
      - 'public/manifest.webmanifest'
      - 'app/icon.tsx'
      - 'app/apple-icon.tsx'
      - 'app/pwa/**'
      - 'app/api/brand/**'
      - 'app/login/page.tsx'
      - '.github/workflows/frontend-ux.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run tests/navigation.test.ts tests/brand-assets.test.ts tests/catalog.test.ts tests/oil-quote.test.ts tests/sales-quote.test.ts tests/order-extras.test.ts tests/maintenance-history.test.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
