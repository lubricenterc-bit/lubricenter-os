name: Frontend desktop UX
on:
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/layout.tsx'
      - 'app/shell-v2.css'
      - 'app/home-v2.css'
      - 'components/app-shell.tsx'
      - 'components/os-icon.tsx'
      - 'components/app-session-context.tsx'
      - 'lib/navigation.ts'
      - 'tests/navigation.test.ts'
      - '.github/workflows/frontend-ux.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
