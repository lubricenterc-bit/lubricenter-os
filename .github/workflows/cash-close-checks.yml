name: Cash close checks
on:
  pull_request:
    paths:
      - 'components/finance-cash-*'
      - 'components/finance-cash-close*'
      - 'app/cash-close/**'
      - 'app/finance/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cash-close-checks.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
